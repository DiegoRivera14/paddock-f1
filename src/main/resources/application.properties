spring.application.name=paddock

# Base de datos H2 en archivo (los datos persisten entre arranques)
spring.datasource.url=jdbc:h2:file:./data/paddock;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA: crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola H2 para inspeccionar la base de datos en desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
