spring.application.name=paddock

# Base de datos H2 en archivo (los datos persisten entre arranques)
spring.datasource.url=jdbc:h2:file:./data/paddock;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA: crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola H2 para inspeccionar la base de datos en desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Importacion de datos de F1 (API Jolpica-F1)
paddock.api.base-url=https://api.jolpi.ca/ergast/f1
paddock.temporada=2025

# Portada en modo demostracion: ronda del fin de semana fijo y fecha "de hoy" simulada
paddock.demo.ronda=1
paddock.demo.hoy=2025-03-11
